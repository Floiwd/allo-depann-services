  </g>
  <text x="200" y="268" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#64748b" font-weight="500">SCHÉMA TECHNIQUE — EXTRACTION DE CLÉ ET CYLINDRE</text>
</svg>