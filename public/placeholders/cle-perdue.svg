    <!-- Key blade inside cylinder -->
    <path d="M100 45 L150 45 L150 49 L142 49 L142 53 L134 53 L134 49 L126 49 L126 53 L118 53 L118 49 L100 49 Z" fill="#94a3b8" stroke="#475569" stroke-width="1.5"/>
