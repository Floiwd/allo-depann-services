    <circle cx="35" cy="50" r="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <path d="M58 45 L90 45 L93 52 L88 55 L58 55 Z" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5"/>
    <!-- Broken gap -->
