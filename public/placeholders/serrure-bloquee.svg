<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" fill="none">
  <rect width="400" height="300" fill="#f8fafc" rx="8"/>
  <rect x="20" y="20" width="360" height="260" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4 4" rx="6"/>
  <!-- Lock mechanism blueprint -->
  <g transform="translate(130, 65)">
    <rect x="0" y="0" width="140" height="150" rx="4" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
    <!-- Deadbolt -->
    <rect x="95" y="45" width="55" height="22" rx="2" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
    <!-- Springs & tumblers -->
    <circle cx="50" cy="56" r="24" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 4"/>
    <circle cx="50" cy="56" r="10" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
    <rect x="46" y="90" width="8" height="35" rx="2" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5"/>
    <!-- Warning lock indicator -->
    <path d="M110 32 L110 40 M110 44 L110 46" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <text x="200" y="268" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#64748b" font-weight="500">SCHÉMA TECHNIQUE — DÉBLOCAGE MÉCANIQUE DU PÊNE</text>
</svg>