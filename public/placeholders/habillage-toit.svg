<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141923" />
      <stop offset="100%" stop-color="#0b0e14" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#252f3f" stroke-width="0.75" stroke-opacity="0.4" />
    </pattern>
    <pattern id="diag" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 0 20 L 20 0" fill="none" stroke="#252f3f" stroke-width="0.5" stroke-opacity="0.3" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)" />
  <rect width="800" height="500" fill="url(#grid)" />
  
  <!-- Subtle border & corner accents -->
  <rect x="20" y="20" width="760" height="460" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="6,6" opacity="0.6" />
  <path d="M 20 40 L 20 20 L 40 20 M 760 20 L 780 20 L 780 40 M 780 460 L 780 480 L 760 480 M 40 480 L 20 480 L 20 460" fill="none" stroke="#64748b" stroke-width="2" />

  <!-- Technical Schematic Graphics -->
  <g transform="translate(400, 210)" stroke="#94a3b8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    
      <!-- Fascia and soffit detail -->
      <polygon points="-80,-60 -80,40 -20,40 -20,-60" stroke="#cbd5e1" stroke-width="2" />
      <line x1="-80" y1="-60" x2="80" y2="-60" stroke="#94a3b8" stroke-width="2" />
      <!-- Vented soffit panels -->
      <line x1="-20" y1="20" x2="100" y2="20" stroke="#cbd5e1" stroke-width="3" />
      <line x1="0" y1="25" x2="10" y2="25" stroke="#64748b" />
      <line x1="30" y1="25" x2="40" y2="25" stroke="#64748b" />
      <line x1="60" y1="25" x2="70" y2="25" stroke="#64748b" />
      <!-- Rafter end -->
      <path d="M-80,-60 L100,20" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,4" />
    
  </g>

  <!-- Notice Badge Top -->
  <g transform="translate(400, 56)">
    <rect x="-160" y="-14" width="320" height="28" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text text-anchor="middle" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1" letter-spacing="1.5">
      À REMPLACER PAR VOS PHOTOS
    </text>
  </g>

  <!-- Center Title & Trade Subtitle -->
  <text x="400" y="360" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#f8fafc" letter-spacing="0.5">
    Habillage de dessous de toit & rives
  </text>
  <text x="400" y="388" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">
    Sous-faces PVC/Alu, planches de rive et finitions durables
  </text>

  <!-- Bottom Craft Bar -->
  <g transform="translate(400, 440)">
    <line x1="-120" y1="0" x2="120" y2="0" stroke="#334155" stroke-width="1" />
    <circle cx="0" cy="0" r="3" fill="#cbd5e1" />
    <text text-anchor="middle" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#64748b" letter-spacing="1">
      TB TOITURES • 54410 LANEUVEVILLE-DEVANT-NANCY
    </text>
  </g>
</svg>